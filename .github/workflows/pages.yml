name: Build and publish static preview
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: linkxcap-preview
  cancel-in-progress: true
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SITE_URL: https://zivyangll.github.io
          SITE_BASE: /linkxcap-preview
          PUBLIC_CONTENT_MODE: preview
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: dist
          include-hidden-files: true
      - name: Publish only compiled files to the public Pages repository
        env:
          PAGES_DEPLOY_KEY: ${{ secrets.PAGES_DEPLOY_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/linkxcap-pages-key"
          trap 'rm -f "$key_path"' EXIT
          install -m 600 /dev/null "$key_path"
          printf '%s\n' "$PAGES_DEPLOY_KEY" > "$key_path"
          export GIT_SSH_COMMAND="ssh -i $key_path -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$GITHUB_WORKSPACE/.github/github_known_hosts"
          publish_path="$RUNNER_TEMP/linkxcap-publish"
          git clone --depth 1 git@github.com:zivyangll/linkxcap-preview.git "$publish_path"
          rsync -a --delete --exclude='.git' dist/ "$publish_path/"
          git -C "$publish_path" config user.name 'github-actions[bot]'
          git -C "$publish_path" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$publish_path" add --all
          if git -C "$publish_path" diff --cached --quiet; then exit 0; fi
          git -C "$publish_path" commit -m "Publish website from ${GITHUB_SHA:0:7}"
          git -C "$publish_path" push origin main
